name: guardrails

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CONFTEST_VERSION: "0.71.0"
  WORKLOAD: workloads/docflow

jobs:
  policy-tests:
    name: Policy unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: "1.21.1"
      - run: opa fmt --fail -l policy
      - run: opa check --strict policy
      - run: opa test policy -v

  bank-guardrails:
    name: Bank guardrails (blocking)
    runs-on: ubuntu-latest
    needs: policy-tests
    steps:
      - uses: actions/checkout@v5
      - name: Install conftest
        run: |
          curl -sSfL -o conftest.tgz \
            "https://github.com/open-policy-agent/conftest/releases/download/v${CONFTEST_VERSION}/conftest_${CONFTEST_VERSION}_Linux_x86_64.tar.gz"
          tar xzf conftest.tgz conftest
          sudo mv conftest /usr/local/bin/
      - name: Check workload
        run: |
          conftest test --combine --parser hcl2 -p policy --data exceptions "$WORKLOAD" -o json > results.json || true
      - name: Report to developer
        shell: pwsh
        run: ./scripts/Write-PolicyReport.ps1 -ResultsPath results.json

  vendor-baseline:
    name: Checkov baseline (advisory)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: bridgecrewio/checkov-action@v12
        with:
          directory: workloads
          framework: terraform
          compact: true
          soft_fail: true
